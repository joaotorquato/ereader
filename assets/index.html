<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef0ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reader">
<title>Reader</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <div class="row">
    <div class="left">
      <button id="back" class="icon" aria-label="Biblioteca" hidden>‹</button>
      <h1 id="title">Reader</h1>
    </div>
    <div id="player" class="controls" hidden>
      <button id="prev" class="icon" aria-label="Parágrafo anterior">⏮</button>
      <button id="play" class="icon primary" aria-label="Tocar">▶</button>
      <button id="next" class="icon" aria-label="Próximo parágrafo">⏭</button>
      <select id="rate" aria-label="Velocidade">
        <option value="1">1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2×</option>
      </select>
      <select id="voice" aria-label="Voz"></select>
    </div>
    <button id="settings" class="icon" aria-label="Menu">☰</button>
  </div>
  <div class="progress" id="progress"><i id="bar"></i></div>
</header>

<main id="main">
  <!-- biblioteca -->
  <section id="library" class="sheet">
    <div class="upload">
      <label class="btn primary">
        <input type="file" id="file" accept=".pdf,.epub,application/pdf,application/epub+zip">
        Enviar PDF ou EPUB
      </label>
      <div class="status" id="upload-status"></div>
    </div>
    <ul id="books" class="books"></ul>
    <p class="empty" id="library-empty" hidden>Nenhum livro ainda. Envie um PDF ou EPUB.</p>
  </section>

  <!-- leitor -->
  <section id="reader" class="sheet" hidden>
    <div id="paragraphs"></div>
    <div class="section-footer">
      <span class="status" id="status"></span>
      <small id="where"></small>
    </div>
    <nav class="section-nav">
      <button id="prev-section">‹ Seção anterior</button>
      <button id="next-section">Próxima seção ›</button>
    </nav>
  </section>
</main>

<audio id="audio" preload="auto" playsinline></audio>

<dialog id="token-dialog">
  <form method="dialog">
    <h3>Token de acesso</h3>
    <input id="token-input" type="password" autocomplete="current-password" placeholder="READER_TOKEN">
    <button class="primary">Entrar</button>
  </form>
</dialog>

<dialog id="settings-dialog">
  <div class="settings-head">
    <h3>Menu</h3>
    <button id="theme" class="icon" aria-label="Tema">◐</button>
  </div>
  <div id="toc" class="toc"></div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
